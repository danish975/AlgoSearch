version: '3.8'

services:
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Since the C++ engine can't be compiled right now, I will omit it from compose 
  # or provide a placeholder for when a C++ builder image is used.
  search-engine:
    build:
      context: ./services/search-engine
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SEED_DATA_FILE=/data/seed.json
    volumes:
      - ./data/seed.json:/data/seed.json

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - SEARCH_ENGINE_URL=http://search-engine:8080
      - MONGODB_URI=mongodb://mongodb:27017/algosearch
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=algosearch-secret-key-123
    depends_on:
      - mongodb
      - redis
      - search-engine

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000/api/v1
    depends_on:
      - api

volumes:
  mongodb_data:
  redis_data:
